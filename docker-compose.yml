name: cliproom

services:
  api:
    build: ./backend
    environment:
      CLIPROOM_DEV: "1"
      MAX_FILE_MB: ${MAX_FILE_MB:-10} # global upload cap; per-room caps (1..this) set at creation
      DB_PATH: /data/db/cliproom.db
      DATA_DIR: /data/files
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SWEEPER_INTERVAL_MIN: ${SWEEPER_INTERVAL_MIN:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOKI_URL: http://loki:3100
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # production: set ADMIN_USERNAME, ADMIN_PASSWORD_HASH, DEMO_* (or GUEST_*),
      # SESSION_SECRET, AGENT_TOKEN, BASE_URL (see backend/app/config.py)
    volumes:
      - cliproom-db:/data/db
      - cliproom-files:/data/files
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - otel-collector

  frontend:
    build: ./frontend
    environment:
      # nginx body bound = MAX_FILE_MB + 6 MB automatically (see
      # frontend/start.sh); set NGINX_MAX_BODY_SIZE to override explicitly
      MAX_FILE_MB: ${MAX_FILE_MB:-10}
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
    # SMTP 1025 internal only

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - cliproom-tempo:/var/tempo

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./ops/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - cliproom-loki:/loki

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cliproom-grafana:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  cliproom-db:
  cliproom-files:
  cliproom-tempo:
  cliproom-loki:
  cliproom-grafana:
