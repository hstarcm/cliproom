<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipRoom</title>
    <style>
      :root { color-scheme: light; } /* deterministic light rendering: no UA dark-mode surprises */
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f9;
        color: #1c1e21;
      }
      .role-badge {
        display: inline-block; margin-left: 8px; padding: 3px 12px;
        border-radius: 999px; font-size: 14px; font-weight: 700;
        vertical-align: middle; color: #fff;
      }
      .role-badge.admin { background: #1f6feb; }
      .role-badge.guest { background: #9a6700; }
      a { color: #1f6feb; }
      .shell { max-width: 880px; margin: 0 auto; padding: 16px; }
      .card {
        background: #fff; border: 1px solid #e1e4e8; border-radius: 10px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .muted { color: #6a737d; font-size: 13px; }
      .author { font-weight: 600; font-size: 13px; }
      .presence { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
      .chip {
        border-radius: 999px; padding: 2px 10px; font-size: 13px;
        border: 1px solid #e1e4e8; background: #fff;
      }
      button {
        font: inherit; cursor: pointer; border-radius: 8px;
        border: 1px solid #d0d7de; background: #f6f8fa; padding: 6px 12px;
        color: #1f2328; /* explicit: never inherit UA dark-scheme white */
      }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      button.danger { color: #cf222e; background: #fff; border-color: #cf6a7494; }
      .upload-box {
        border: 1.5px dashed #9aa4af;
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        background: #f6f8fa;
      }
      .upload-box-title { font-weight: 600; font-size: 14px; color: #1c1e21; }
      .file-label {
        cursor: pointer; padding: 7px 14px; border: 1px solid #6e7781;
        border-radius: 8px; background: #ffffff; color: #1c1e21;
        font-size: 14px; display: inline-block; min-width: 120px;
      }
      .file-label:hover { background: #eef1f4; }
      .file-label input[type="file"] {
        position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;
      }
      button.upload-btn {
        background: #1c1e21; border-color: #1c1e21; color: #ffffff;
        font-weight: 600;
      }
      button.upload-btn:hover { background: #33383f; }
      button.upload-btn:disabled { background: #8c959f; border-color: #8c959f; }
      textarea, input[type="text"], input[type="password"] {
        font: inherit; padding: 8px; border-radius: 8px;
        border: 1px solid #d0d7de; width: 100%; box-sizing: border-box;
      }
      .error { color: #cf222e; font-size: 13px; }
      .share-url {
        font-family: ui-monospace, monospace; background: #f6f8fa;
        padding: 6px 8px; border-radius: 6px; word-break: break-all;
      }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eaeef2; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
