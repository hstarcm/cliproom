server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # outer bound above the app's 10 MB upload cap (+ multipart overhead);
    # per-room caps (FR-13a) are enforced by the api with clean 413 JSON
    client_max_body_size 16m;

    # security headers (SR-6)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API proxy incl. WebSocket upgrade
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # metrics proxy (internal observability only)
    location = /metrics {
        proxy_pass http://api:8000/metrics;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
